<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Keycloak 大全集 学習アプリ</title>
<style>
:root { --bg:#fff; --card:#fff; --fg:#222; --mute:#666; --line:#e2e2e2; --pri:#1f4f99; --ok:#222; --ng:#b3261e; --soft:#f5f5f5; }
* { box-sizing: border-box; }
body { margin:0; background:#fff; color:var(--fg); font:17px/1.8 -apple-system,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif; }
#app { max-width:860px; margin:0 auto; padding:16px; }
h1 { font-size:1.4rem; margin:.2em 0 .6em; } h2 { font-size:1.2rem; margin:1em 0 .4em; } h3 { font-size:1.08rem; margin:1em 0 .3em; } h4 { font-size:1rem; margin:.9em 0 .2em; }
.card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:14px 18px; margin:12px 0; }
.warn { background:var(--soft); border:1px solid var(--line); border-left:3px solid var(--ng); color:var(--fg); padding:10px 14px; border-radius:4px; margin:8px 0; }
.ok { color:var(--ok); } .ng { color:var(--ng); } .mute { color:var(--mute); font-size:.9rem; }
button { font:inherit; padding:.5em 1.1em; border:1px solid var(--pri); background:var(--pri); color:#fff; border-radius:6px; cursor:pointer; margin:4px 6px 4px 0; }
button.sub { background:#fff; color:var(--pri); } button.small { font-size:.85rem; padding:.2em .7em; }
button:disabled { opacity:.45; cursor:default; }
button.sel { outline:2px solid var(--fg); }
.row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.bar { height:8px; background:#eee; border-radius:4px; overflow:hidden; } .bar > div { height:100%; background:var(--pri); }
.chap { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; border-top:1px solid var(--line); padding:8px 0; } .chap:first-child { border-top:0; }
.tag { font-size:.8rem; padding:1px 8px; border-radius:6px; border:1px solid var(--line); margin-left:6px; }
.tag.done { color:var(--ok); border-color:var(--ok); } .tag.prog { color:var(--pri); border-color:var(--pri); } .tag.lock { color:var(--mute); }
.pbar { height:3px; background:#eee; border-radius:2px; overflow:hidden; margin:4px 0 8px; } .pbar > div { height:100%; background:var(--pri); }
.nav { display:flex; gap:8px; margin:12px 0; } .nav button { flex:1; margin:0; padding:.7em 1em; }
details { margin:8px 0; } summary { cursor:pointer; }
.lesson { overflow-wrap:anywhere; } .lesson table { border-collapse:collapse; display:block; overflow-x:auto; } .lesson td, .lesson th { border:1px solid var(--line); padding:3px 8px; }


.lesson pre { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:8px 12px; overflow-x:auto; white-space:pre; overflow-wrap:normal; font:0.82rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
.lesson code { background:var(--soft); border-radius:4px; padding:0 4px; font:0.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; overflow-wrap:anywhere; }
.lesson pre code { background:none; padding:0; }
.lesson th { background:var(--soft); }
.lesson p { margin:.4em 0; }

/* ハンズオン本文: goal / step / check / read */
.lesson .goal { margin:.2em 0 .8em; padding:.4em .8em; background:var(--soft); border-left:3px solid #bbb; }
.lesson .step { margin:1.4em 0 0; padding-top:.8em; border-top:1px solid var(--line); }
.lesson .step h4 { margin:0 0 .3em; font-size:1rem; font-weight:700; }
.lesson .check, .lesson .read { margin:.5em 0; }
.lesson .check > b, .lesson .read > b { display:block; font-size:.8rem; font-weight:400; color:var(--mute); }
.lesson .read p, .lesson .read ul { margin:.2em 0; }
.lesson pre.out { background:var(--soft); border-color:transparent; margin:.3em 0; }
b.key { font-weight:700; }
.trap { font-weight:700; background:var(--soft); padding:0 3px; border-radius:3px; }




.lesson ol { padding-left:1.6em; } .lesson ol > li { margin:.35em 0; padding-left:.2em; } .lesson ul { padding-left:1.3em; }
.prewrap { position:relative; margin:.6em 0; }
.prewrap pre { margin:0; padding-top:30px; }
.prewrap .copy { position:absolute; top:4px; right:6px; margin:0; font-size:.7rem; padding:0 .6em; background:#fff; color:var(--mute); border-color:var(--line); border-radius:4px; }
.prewrap .copy.copied { color:var(--fg); border-color:var(--fg); }
.tried { display:flex; align-items:center; gap:10px; flex-wrap:wrap; border:1px solid var(--line); border-radius:6px; padding:10px 14px; background:#fff; }
.tried.on { border-color:var(--fg); background:var(--soft); }
.tried button { margin:0; }
.labcard table { border-collapse:collapse; width:100%; font-size:.92rem; } .labcard td, .labcard th { border:1px solid var(--line); padding:3px 8px; text-align:left; vertical-align:top; overflow-wrap:anywhere; }
.labcard th { background:var(--soft); white-space:nowrap; }
.labcard pre { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:8px 12px; overflow-x:auto; font:0.82rem/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; margin:.4em 0; }
.labcard code { background:var(--soft); border-radius:4px; padding:0 4px; font:0.9em ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
</style>
</head>
<body>
<div id="app"></div>
<script src="data.js"></script>
<script src="logic.js"></script>
<script>
(function () {
  'use strict';
  var L = window.Logic, DATA = window.DATA;
  var root = document.getElementById('app');
  var P, storageOk = true, storage = null, saveFailed = false, notice = '';
  var view = { name: 'home' };
  var sessionPages = 0; // この起動中に「次へ」で進めたページ数

  // ---------- 保存 ----------
  try { storage = window.localStorage; } catch (e) { storage = null; }
  var migrated = false;
  if (storage) {
    var r = L.loadProgress(storage); P = r.progress; storageOk = r.ok; migrated = !!r.migrated;
  } else { P = L.emptyProgress(); storageOk = false; }
  function save() {
    if (!storage || !L.saveProgress(storage, P)) saveFailed = true;
  }

  // ---------- データ索引 ----------
  var lessonById = {}, chapterOfLesson = {}, pageIndex = {};
  DATA.chapters.forEach(function (c) {
    c.lessons.forEach(function (l) {
      lessonById[l.id] = l; chapterOfLesson[l.id] = c;
      l.pages.forEach(function (pg) { pageIndex[pg.id] = { lesson: l, chapter: c }; });
    });
  });
  // 旧バージョンからの移行時は、完了済みレッスンの全ページを「試した」扱いにする
  P = L.syncLessons(P, DATA, migrated);
  if (migrated) save();

  function chapter(no) { return DATA.chapters.filter(function (c) { return c.no === no; })[0]; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (m) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]; }); }
  function isDone(id) { return P.lessonsDone.indexOf(id) >= 0; }
  function firstUndone(c) { return c.lessons.filter(function (l) { return !isDone(l.id); })[0] || null; }
  function firstUndonePage(l) {
    for (var i = 0; i < l.pages.length; i++) if (!L.isPageDone(P, l.pages[i].id)) return i;
    return 0;
  }
  function countAll() {
    var t = { lessons: 0, lessonsDone: 0, pages: 0, pagesDone: 0 };
    DATA.chapters.forEach(function (c) {
      c.lessons.forEach(function (l) {
        var s = L.lessonStats(P, l);
        t.lessons++; if (isDone(l.id)) t.lessonsDone++;
        t.pages += s.total; t.pagesDone += s.done;
      });
    });
    return t;
  }
  function go(v) { view = v; render(); window.scrollTo(0, 0); }
  function reportBtn(id) { return '<button class="small sub" data-act="report" data-id="' + esc(id) + '">記述の間違いをメモ</button>'; }

  // ---------- 本文の装飾（pre のコピーボタン。pre.out は対象外） ----------
  function decorate(html) {
    return html
      .replace(/<pre>/g, '<div class="prewrap"><button class="small sub copy" data-act="copy" type="button">コピー</button><pre>')
      .replace(/<\/pre>/g, '</pre></div>')
      .replace(/<pre class="out">([\s\S]*?)<\/pre><\/div>/g, '<pre class="out">$1</pre>');
  }
  function copyText(text, btn) {
    function done(ok) {
      if (!btn) return;
      btn.textContent = ok ? 'コピーしました' : 'コピーできません';
      btn.classList.toggle('copied', ok);
      setTimeout(function () { btn.textContent = 'コピー'; btn.classList.remove('copied'); }, 1500);
    }
    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        var ok = document.execCommand('copy'); ta.remove(); done(ok);
      } catch (e) { done(false); }
    }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(function () { done(true); }, fallback);
    else fallback();
  }

  // ---------- ハンズオン環境カード ----------
  function copyPre(text) { return '<div class="prewrap"><button class="small sub copy" data-act="copy" type="button">コピー</button><pre>' + text + '</pre></div>'; }
  function labCard() {
    return '<div class="card labcard"><h2>ハンズオン環境</h2>' +
      '<p>環境は用意されていません。<b>第1章で自分で作ります</b>（<code>~/develop/kc-handson/</code> に <code>docker-compose.yml</code> を書き、Keycloak を起動）。アプリ（<code>spa/</code> <code>web/</code> <code>api/</code>）も本文の手順で自分で書きます。</p>' +
      '<p><b>前提ソフト</b>: Docker（Docker Compose）、<code>curl</code>、<code>jq</code>、Node.js 20 以上、<code>python3</code></p>' +
      '<h3>第1章のあとの起動・停止・やり直し</h3>' +
      copyPre('cd ~/develop/kc-handson\ndocker compose up -d      # 起動\ndocker compose down        # 停止（データは残る）\ndocker compose down -v     # 停止してデータも消す（やり直し）') +
      '<p class="mute">データを消した場合は、realm や client は本文の手順で作り直します。</p>' +
      '<h3>URL 早見表（学習が進むと使います）</h3>' +
      '<table><thead><tr><th>サービス</th><th>URL</th><th>メモ</th></tr></thead><tbody>' +
      '<tr><td>Keycloak</td><td><code>http://localhost:8080</code></td><td>管理コンソールは英語 UI。realm は <code>demo</code></td></tr>' +
      '<tr><td>Mailpit</td><td><code>http://localhost:8025</code></td><td>第11章で追加。Keycloak のメール受信箱</td></tr>' +
      '<tr><td>OpenLDAP</td><td><code>ldap://localhost:389</code></td><td>第13章で追加。Keycloak からは <code>ldap://openldap:389</code></td></tr>' +
      '<tr><td>自作 SPA</td><td><code>http://localhost:3000</code></td><td><code>python3 -m http.server 3000</code></td></tr>' +
      '<tr><td>自作 Web アプリ</td><td><code>http://localhost:3001</code></td><td><code>node server.js</code></td></tr>' +
      '<tr><td>自作 API</td><td><code>http://localhost:4000</code></td><td><code>node server.js</code></td></tr>' +
      '</tbody></table>' +
      '<p class="mute">URL は必ず <code>localhost</code> を使ってください（<code>127.0.0.1</code> だとトークンの <code>iss</code> が変わります）。</p></div>';
  }

  // ---------- ホーム ----------
  function homeView() {
    var t = countAll();
    var h = '<h1>Keycloak 大全集 学習アプリ</h1>';
    h += '<div class="card"><div class="row"><b>全体の進捗</b><span class="mute">レッスン ' + t.lessonsDone + ' / ' + t.lessons + '　ページ ' + t.pagesDone + ' / ' + t.pages + '</span></div>';
    h += '<div class="bar"><div style="width:' + (t.pages ? Math.round(t.pagesDone * 100 / t.pages) : 0) + '%"></div></div>';
    var cont = continueTarget();
    if (cont) h += '<p><button data-act="continue">続きから（' + esc(cont.label) + '）</button></p>';
    else h += '<p class="mute">続きから進めるレッスンはありません（全章の学習が完了）。</p>';
    h += '</div>' + labCard();
    h += '<div class="card"><h2>章一覧</h2>';
    DATA.chapters.forEach(function (c) {
      var done = c.lessons.filter(function (l) { return isDone(l.id); }).length;
      var started = c.lessons.some(function (l) { return L.lessonStats(P, l).done > 0; }) || (P.position && P.position.ch === c.no);
      var tag = done === c.lessons.length ? '<span class="tag done">完了</span>' : (started ? '<span class="tag prog">進行中</span>' : '');
      h += '<div class="chap"><div>第' + c.no + '章 ' + esc(c.title) + tag + '<div class="mute">レッスン ' + done + '/' + c.lessons.length + '</div></div>';
      h += '<div><button data-act="chapter-start" data-ch="' + c.no + '">' + (done || started ? '学習する' : '始める') + '</button></div></div>';
    });
    h += '</div><div class="card"><h2>その他</h2><div class="row">';
    h += '<button class="sub" data-act="reports">間違いメモ（' + P.reports.length + '件）</button>';
    h += '<button class="sub" data-act="settings">設定</button></div></div>';
    return h;
  }
  function continueTarget() {
    var pos = P.position;
    if (pos && lessonById[pos.lessonId] && !isDone(pos.lessonId)) {
      var c = chapterOfLesson[pos.lessonId], pi = pageIdx(lessonById[pos.lessonId], pos.page || 0);
      return { id: pos.lessonId, page: pi, label: '第' + c.no + '章 ' + lessonById[pos.lessonId].title + ' ページ' + (pi + 1) };
    }
    for (var i = 0; i < DATA.chapters.length; i++) {
      var ch = DATA.chapters[i], u = firstUndone(ch);
      if (u) return { id: u.id, page: firstUndonePage(u), label: '第' + ch.no + '章 ' + u.title };
    }
    return null;
  }

  // ---------- セッション（1画面 = 1ページ） ----------
  var PAGES_PER_BREAK = 6;
  function pageIdx(l, page) { page = parseInt(page, 10); return page >= 0 && page < l.pages.length ? page : 0; }
  function openLesson(id, page) {
    var c = chapterOfLesson[id], l = lessonById[id], pg = pageIdx(l, page);
    P = L.setPosition(P, { ch: c.no, lessonId: id, page: pg }); save();
    go({ name: 'lesson', id: id, page: pg });
  }
  function lessonView() {
    var v = view, l = lessonById[v.id], c = chapterOfLesson[v.id], pg = l.pages[v.page], n = l.pages.length;
    var idx = c.lessons.indexOf(l), tried = L.isPageDone(P, pg.id), s = L.lessonStats(P, l);
    var h = '<div class="mute">第' + c.no + '章 ' + esc(l.title) + ' ・ ページ ' + (v.page + 1) + '/' + n + '（試した ' + s.done + '/' + s.total + '）</div>';
    h += '<div class="pbar"><div style="width:' + Math.round((v.page + 1) * 100 / n) + '%"></div></div>';
    h += '<h1>' + esc(pg.title) + '</h1>';
    h += '<div class="card lesson">' + decorate(pg.html) + '</div>';
    h += '<div class="tried' + (tried ? ' on' : '') + '"><button class="' + (tried ? '' : 'sub') + '" data-act="page-toggle">' + (tried ? '✓ このページを試した' : 'このページを試した') + '</button>' +
      '<span class="mute">' + (tried ? '記録済み（もう一度押すと取り消し）' : '手順を実際に試したら押してください') + '</span></div>';
    h += '<p>' + reportBtn(pg.id) + '</p>';
    h += '<div class="nav"><button class="sub" data-act="page-prev"' + (v.page === 0 && idx === 0 ? ' disabled' : '') + '>前へ</button>';
    h += '<button data-act="page-next">' + (v.page + 1 < n ? '次へ' : (idx + 1 < c.lessons.length ? '次のレッスンへ' : '章の終わりへ')) + '</button></div>';
    return h + '<button class="sub small" data-act="home">ホームへ（位置は保存済み）</button>';
  }
  function togglePage() {
    var pg = lessonById[view.id].pages[view.page];
    P = L.markPage(P, DATA, pg.id, !L.isPageDone(P, pg.id)); save();
    var y = window.scrollY; render(); window.scrollTo(0, y);
  }
  function pageNext() {
    var v = view, l = lessonById[v.id], c = chapterOfLesson[v.id], i = v.page, idx = c.lessons.indexOf(l), tgt;
    sessionPages++;
    if (i + 1 < l.pages.length) tgt = { id: l.id, page: i + 1 };
    else if (idx + 1 < c.lessons.length) tgt = { id: c.lessons[idx + 1].id, page: 0 };
    else tgt = { end: c.no };
    if (tgt.id) { var c2 = chapterOfLesson[tgt.id]; P = L.setPosition(P, { ch: c2.no, lessonId: tgt.id, page: tgt.page }); save(); }
    if (sessionPages % PAGES_PER_BREAK === 0) go({ name: 'break', tgt: tgt });
    else runTarget(tgt);
  }
  function pagePrev() {
    var v = view, l = lessonById[v.id], c = chapterOfLesson[v.id], idx = c.lessons.indexOf(l);
    if (v.page > 0) openLesson(v.id, v.page - 1);
    else if (idx > 0) { var pl = c.lessons[idx - 1]; openLesson(pl.id, pl.pages.length - 1); }
  }
  function runTarget(t) {
    if (t.id) openLesson(t.id, t.page);
    else go({ name: 'chapterend', ch: t.end });
  }
  function breakView() {
    var t = view.tgt;
    return '<h1>ここまで読みました</h1><div class="card"><p>進捗は保存されています。区切りがよければ今日はここまでにできます。Keycloak は <code>docker compose down</code> で止められます（データは残ります。<code>-v</code> を付けると消えます）。</p></div>' +
      '<button data-act="break-go">' + (t.id ? '続ける' : '章の終わりへ') + '</button>' +
      '<button class="sub" data-act="home">今日はここまで</button>';
  }
  function chapterEndView() {
    var c = chapter(view.ch), nextC = chapter(view.ch + 1);
    var left = c.lessons.filter(function (l) { return !isDone(l.id); }).length;
    return '<h1>第' + c.no + '章 の最後まで来ました</h1><div class="card"><p>' +
      (left ? '「このページを試した」が付いていないページが残っているレッスンが ' + left + ' 個あります。ホームの章一覧から続きを選べます。' : 'すべてのページを試しました。') + '</p></div>' +
      (nextC ? '<button data-act="chapter-start" data-ch="' + nextC.no + '">第' + nextC.no + '章へ進む</button>' : '') +
      '<button class="sub" data-act="home">ホームへ</button>';
  }

  // ---------- 間違いメモ / 設定 ----------
  function reportsView() {
    var h = '<h1>間違いメモ</h1><div class="card">';
    if (!P.reports.length) h += '<p class="mute">まだありません。ページの「記述の間違いをメモ」から追加できます。</p>';
    P.reports.forEach(function (r, i) {
      h += '<div class="chap"><div><span class="mute">' + esc(r.id) + '</span><br>' + esc(r.memo) + '</div><button class="small sub" data-act="report-del" data-i="' + i + '">削除</button></div>';
    });
    return h + '</div><button data-act="export-reports"' + (P.reports.length ? '' : ' disabled') + '>メモを書き出す</button><button class="sub" data-act="home">ホームへ</button>';
  }
  function settingsView() {
    return '<h1>設定</h1>' +
      '<div class="card"><h2>進捗のバックアップ</h2><button data-act="export">進捗JSONを書き出す</button><p><input type="file" id="importFile" accept=".json,application/json"></p><button class="sub" data-act="import">読み込む</button><p class="mute">旧形式（version 1）の進捗JSONも読み込めます。</p></div>' +
      '<div class="card"><h2>進捗の消去</h2><button class="sub" data-act="reset">すべて消去</button></div>' +
      '<button class="sub" data-act="home">ホームへ</button>';
  }
  function download(name, text) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function stamp() { var d = new Date(); return d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2); }

  // ---------- 描画 ----------
  function render() {
    var h = '';
    if (!storageOk) h += '<div class="warn">保存できません：ブラウザの保存領域を使えない、または保存データが壊れていたため、進捗なしで起動しました。進捗は記録されない可能性があります。「設定」から進捗JSONを書き出してバックアップしてください。</div>';
    if (saveFailed) h += '<div class="warn">進捗を保存できませんでした。設定の「進捗JSONを書き出す」でバックアップしてください。</div>';
    if (notice) { h += '<div class="warn">' + esc(notice) + '</div>'; notice = ''; }
    var n = view.name;
    if (n === 'home') h += homeView();
    else if (n === 'lesson') h += lessonView();
    else if (n === 'break') h += breakView();
    else if (n === 'chapterend') h += chapterEndView();
    else if (n === 'reports') h += reportsView();
    else if (n === 'settings') h += settingsView();
    root.innerHTML = h;
  }

  root.addEventListener('click', function (e) {
    var t = e.target; while (t && t !== root && !(t.dataset && t.dataset.act)) t = t.parentNode;
    if (!t || t === root) return;
    var act = t.dataset.act, d = t.dataset;
    switch (act) {
      case 'home': go({ name: 'home' }); break;
      case 'continue': { var c = continueTarget(); if (c) openLesson(c.id, c.page); break; }
      case 'chapter-start': {
        var ch = chapter(parseInt(d.ch, 10)); if (!ch) break;
        var u = firstUndone(ch);
        if (u) openLesson(u.id, P.position && P.position.lessonId === u.id ? P.position.page || 0 : firstUndonePage(u));
        else if (ch.lessons.length) openLesson(ch.lessons[0].id, 0);
        break;
      }
      case 'page-prev': pagePrev(); break;
      case 'page-next': pageNext(); break;
      case 'page-toggle': togglePage(); break;
      case 'break-go': runTarget(view.tgt); break;
      case 'copy': {
        var wrap = t.parentNode, pre = wrap && wrap.querySelector('pre');
        if (pre) copyText(pre.textContent, t);
        break;
      }
      case 'report': {
        var memo = window.prompt('どこが間違いだと思いますか?（メモ）\n対象: ' + d.id, '');
        if (memo !== null && memo.trim()) { P = L.addReport(P, d.id, memo.trim(), Date.now()); save(); notice = 'メモを保存しました（' + d.id + '）。'; var yy = window.scrollY; render(); window.scrollTo(0, yy); }
        break;
      }
      case 'reports': go({ name: 'reports' }); break;
      case 'report-del': P = L.removeReport(P, parseInt(d.i, 10)); save(); render(); break;
      case 'export-reports': download('keycloak-taizen-reports-' + stamp() + '.json', JSON.stringify(P.reports, null, 2)); break;
      case 'settings': go({ name: 'settings' }); break;
      case 'export': download('keycloak-taizen-progress-' + stamp() + '.json', JSON.stringify(P, null, 2)); break;
      case 'import': {
        var f = document.getElementById('importFile').files[0];
        if (!f) { notice = 'ファイルを選んでください。'; render(); break; }
        var fr = new FileReader();
        fr.onload = function () {
          var res = L.importProgress(String(fr.result), P);
          if (res.error) notice = '読み込めませんでした: ' + res.error + '（現在の進捗は変更していません）';
          else { P = L.syncLessons(res.progress, DATA, res.migrated); save(); notice = '進捗を読み込みました。'; }
          render();
        };
        fr.readAsText(f); break;
      }
      case 'reset': if (window.confirm('進捗をすべて消去します。よろしいですか?')) { P = L.emptyProgress(); save(); sessionPages = 0; notice = '消去しました。'; go({ name: 'home' }); } break;
    }
  });

  // 起動時：保存された位置のレッスンを開く（ホームから「続きから」でも可）
  if (P.position && lessonById[P.position.lessonId] && !isDone(P.position.lessonId)) {
    openLesson(P.position.lessonId, P.position.page || 0);
  }
  render();
})();
</script>
</body>
</html>
